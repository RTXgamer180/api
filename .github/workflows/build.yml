
name: JJ Bot Control - Master Installer

on:
  push:
    branches:
      - main
    paths:
      - '**/JJ_Bot_Control.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jj-bot-control-deploy
  cancel-in-progress: false

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_CONTROL_TOKEN }}
          fetch-depth: 0

      - name: Find and install JJ Bot Control
        id: install
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find . -type f -name 'JJ_Bot_Control.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "No JJ_Bot_Control.zip found."
            exit 1
          fi

          echo "Found: $ZIP_PATH"

          TARGET="$(dirname "$ZIP_PATH")"
          TEMP="$(mktemp -d)"

          unzip -q "$ZIP_PATH" -d "$TEMP"

          cp -a "$TEMP"/. "$TARGET"/

          mkdir -p .github/workflows

          SOURCE="$TARGET/.github/workflows/launch.yml"
          DEST=".github/workflows/launch.yml"

          if [ -f "$SOURCE" ]; then
            if [ "$SOURCE" != "$DEST" ]; then
              cp "$SOURCE" "$DEST"
            fi
            echo "Installed launch.yml into root workflows."
          else
            echo "WARNING: No launch.yml found in project."
          fi

          if [ "$ZIP_PATH" = "./JJ_Bot_Control.zip" ]; then
            mv "$ZIP_PATH" "./JJ_Bot_Control.installed.zip"
          else
            mv "$ZIP_PATH" "$TARGET/JJ_Bot_Control.installed.zip"
          fi

          rm -rf "$TEMP"

          SITE_DIR="$(find "$TARGET" -type f -path '*/public/index.html' \
            -print -quit | xargs -r dirname)"

          if [ -z "$SITE_DIR" ]; then
            echo "Could not find public/index.html."
            exit 1
          fi

          echo "site_dir=$SITE_DIR" >> "$GITHUB_OUTPUT"
          echo "Website directory: $SITE_DIR"

      - name: Commit installed project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install JJ Bot Control project"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.install.outputs.site_dir }}

      - name: Deploy website
        uses: actions/deploy-pages@v4
