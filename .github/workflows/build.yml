
name: Install JJ Bot Control Project

on:
  push:
    branches: [main]
    paths:
      - '**/JJ_Bot_Control.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jj-bot-control-deploy
  cancel-in-progress: false

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_CONTROL_TOKEN }}
          fetch-depth: 0

      - name: Install project if ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=$(find . -type f \
            -name 'JJ_Bot_Control.zip' \
            -not -path './.git/*' \
            -print -quit || true)

          if [ -n "$ZIP_PATH" ]; then
            TARGET=$(dirname "$ZIP_PATH")
            TEMP=$(mktemp -d)

            echo "Installing: $ZIP_PATH"

            unzip -q "$ZIP_PATH" -d "$TEMP"
            cp -a "$TEMP"/. "$TARGET"/

            mkdir -p .github/workflows

            SOURCE="$TARGET/.github/workflows/launch.yml"
            DEST="./.github/workflows/launch.yml"

            if [ -f "$SOURCE" ]; then
              if [ "$(realpath "$SOURCE")" != "$(realpath "$DEST")" ]; then
                cp -f "$SOURCE" "$DEST"
              fi
            else
              echo "launch.yml not found in project ZIP!"
              exit 1
            fi

            mv "$ZIP_PATH" \
              "$(dirname "$ZIP_PATH")/JJ_Bot_Control_installed.zip"

            rm -rf "$TEMP"
            echo "Project installed!"
          else
            echo "No installation ZIP found. Checking existing installation..."
          fi

          SITE=$(find . -type f \
            -path '*/public/index.html' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$SITE" ]; then
            echo "No installed website or project ZIP found!"
            exit 1
          fi

          echo "Website found: $SITE"
          echo "site_dir=$(dirname "$SITE")" >> "$GITHUB_ENV"

      - name: Commit installed project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Install JJ Bot Control project"
            git push origin HEAD:main
          else
            echo "No installation changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.site_dir }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
