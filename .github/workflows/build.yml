
name: JJ Bot Control - Master Installer

on:
  push:
    branches: [main]
    paths:
      - '**/JJ_Bot_Control.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jj-bot-control-deploy
  cancel-in-progress: false

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_CONTROL_TOKEN }}
          fetch-depth: 0

      - name: Find and install project
        id: install
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=$(find . -type f \
            -name 'JJ_Bot_Control.zip' \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$ZIP_PATH" ]; then
            echo "ZIP not found!"
            exit 1
          fi

          TARGET=$(dirname "$ZIP_PATH")
          TEMP=$(mktemp -d)

          echo "Found: $ZIP_PATH"
          echo "Target: $TARGET"

          unzip -q "$ZIP_PATH" -d "$TEMP"

          cp -a "$TEMP"/. "$TARGET"/

          mkdir -p .github/workflows

          SOURCE="$TARGET/.github/workflows/launch.yml"
          DEST="./.github/workflows/launch.yml"

          if [ -f "$SOURCE" ]; then
            if [ "$(realpath "$SOURCE")" != "$(realpath "$DEST")" ]; then
              cp -f "$SOURCE" "$DEST"
            else
              echo "launch.yml is already in the correct location."
            fi
          else
            echo "launch.yml not found!"
            exit 1
          fi

          INSTALLED="$(dirname "$ZIP_PATH")/JJ_Bot_Control_installed.zip"
          mv "$ZIP_PATH" "$INSTALLED"

          rm -rf "$TEMP"

          SITE=$(find "$TARGET" -type f \
            -path '*/public/index.html' \
            -print -quit)

          if [ -z "$SITE" ]; then
            echo "Website not found!"
            exit 1
          fi

          echo "site_dir=$(dirname "$SITE")" >> "$GITHUB_OUTPUT"

      - name: Commit installed project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Install JJ Bot Control project"
            git push origin HEAD:main
          else
            echo "Nothing to commit."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.install.outputs.site_dir }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
