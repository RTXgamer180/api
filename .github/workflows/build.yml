
name: Install JJ Bot Control

on:
  push:
    paths:
      - "**/JJ_Bot_Control.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find workflow directory
        id: paths
        run: |
          FILE=$(find . -path "*/.github/workflows/build.yml" -print -quit)
          DIR=$(dirname "$(dirname "$(dirname "$FILE")")")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project directory: $DIR"

      - name: Extract ZIP
        run: |
          DIR="${{ steps.paths.outputs.project_dir }}"
          cd "$DIR"
          mkdir -p extracted
          unzip -o JJ_Bot_Control.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted

      - name: Rename ZIP
        run: |
          DIR="${{ steps.paths.outputs.project_dir }}"
          cd "$DIR"
          mv JJ_Bot_Control.zip JJ_Bot_Control_installed.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install JJ Bot Control" || exit 0
          git push
