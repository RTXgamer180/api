
name: JJ Bot Control - Launch Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find website
        id: site
        run: |
          SITE=$(find . -type f \
            -path "*/public/index.html" \
            -print -quit)

          if [ -z "$SITE" ]; then
            echo "Website not found!"
            exit 1
          fi

          DIR=$(dirname "$SITE")
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

          echo "Website found: $DIR"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
